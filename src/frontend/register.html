<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Skilly | Register</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<button
        id="themeToggle"
        class="theme-toggle"
        type="button"
        aria-label="Toggle light and dark mode">
    🌙 Dark Mode
</button>

<main class="page-container">

    <section class="page-heading">
        <div class="brand-badge">S</div>

        <h1>Create your Skilly account</h1>

        <p>
            Start building your skills and career profile.
        </p>
    </section>

    <section class="form-card">

        <div class="form-header">
            <h2>Register</h2>

            <p>
                Enter your details to create a student account.
            </p>
        </div>

        <form id="registerForm">

            <div class="form-group">
                <label for="name">
                    Full name
                </label>

                <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required>
            </div>

            <div class="form-group">
                <label for="email">
                    Email address
                </label>

                <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required>
            </div>

            <div class="form-group">
                <label for="password">
                    Password
                </label>

                <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        minlength="6"
                        required>
            </div>

            <button
                    type="submit"
                    class="primary-button">
                Create Account
            </button>

        </form>

        <p class="form-footer">
            Already have an account?
            <a href="index.html">
                Login here
            </a>
        </p>

    </section>

</main>

<script src="script.js"></script>

</body>
</html>
