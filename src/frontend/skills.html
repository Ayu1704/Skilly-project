<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Skilly | Skills</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<button
        id="themeToggle"
        class="theme-toggle"
        type="button"
        aria-label="Toggle light and dark mode">
    🌙 Dark Mode
</button>

<div id="navbar"></div>

<main class="page-container">

    <section class="page-heading">
        <div class="brand-badge">S</div>

        <h1>My Skills</h1>

        <p>
            Add and manage your technical skills.
        </p>
    </section>

    <section class="form-card">

        <div class="form-header">
            <h2>Add a Skill</h2>

            <p>
                Enter the skill you want to add to your profile.
            </p>
        </div>

        <form id="skillForm">

            <div class="form-group">
                <label for="skillName">
                    Skill name
                </label>

                <input
                        type="text"
                        id="skillName"
                        name="skillName"
                        placeholder="Example: Java"
                        required>
            </div>

            <div class="form-group">
                <label for="skillLevel">
                    Skill level
                </label>

                <select
                        id="skillLevel"
                        name="skillLevel"
                        required>

                    <option value="">
                        Select skill level
                    </option>

                    <option value="Beginner">
                        Beginner
                    </option>

                    <option value="Intermediate">
                        Intermediate
                    </option>

                    <option value="Advanced">
                        Advanced
                    </option>

                </select>
            </div>

            <button
                    type="submit"
                    class="primary-button">
                Add Skill
            </button>

        </form>

    </section>

    <section class="dashboard-section">

        <h2>All Skills</h2>

        <div id="skillsList">
            Loading skills...
        </div>

    </section>

</main>

<script src="script.js"></script>

</body>
</html>
